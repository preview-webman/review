name: Sinkron Blogger

on:
  schedule:
    - cron: '0 * * * *'   # setiap jam
  workflow_dispatch:       # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

concurrency:
  group: sync-blogger
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ambil feed Blogger
        run: node scripts/sync-blogger.mjs
        env:
          # GANTI dengan alamat situs Anda (akhiri dengan /)
          SITE_URL: https://USERNAME.github.io/NAMA-REPO/

      - name: Simpan perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data a p
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "Sinkron Blogger"
            git push
          fi
