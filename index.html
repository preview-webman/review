<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MAN 2 Grobogan</title>
    <meta name="description" content="Tautan materi dan sumber belajar - MAN 2 Grobogan">
    <meta name="theme-color" content="#0b0c10">

    <!-- Pratinjau saat dibagikan (WhatsApp, Instagram, dll). Ganti og:url dengan alamat GitHub Pages Anda -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="MAN 2 Grobogan">
    <meta property="og:description" content="Tautan materi dan sumber belajar">
    <meta property="og:image" content="assets/logo.webp">
    <!-- <meta property="og:url" content="https://USERNAME.github.io/REPO/"> -->

    <link rel="icon" href="assets/logo.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* Hue dan sudut yang bisa dianimasikan untuk efek RGB */
        @property --hue {
            syntax: '<number>';
            inherits: true;
            initial-value: 0;
        }
        @property --angle {
            syntax: '<angle>';
            inherits: false;
            initial-value: 0deg;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #0b0c10;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
                     max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
            overflow-x: hidden;
        }

        /* Gambar latar digelapkan 80% */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)),
                var(--bg-image, none) center / cover no-repeat,
                #0b0c10;
        }

        /* Animasi hue hanya di kartu (bukan di body) agar repaint lebih ringan */
        .micro-card {
            max-width: 600px;
            width: 100%;
            background: rgba(18, 20, 28, 0.88);
            border-radius: 2.5rem;
            padding: 2rem 1.75rem;
            position: relative;
            animation: hueShift 8s linear infinite;
        }

        @keyframes hueShift {
            from { --hue: 0; }
            to   { --hue: 360; }
        }

        /* Garis tepi RGB berputar searah jarum jam */
        .micro-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 4px;
            background: conic-gradient(
                from var(--angle),
                #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            animation: spinBorder 4s linear infinite;
            pointer-events: none;
        }

        @keyframes spinBorder {
            to { --angle: 360deg; }
        }

        .profile { text-align: center; margin-bottom: 2rem; }

        .avatar {
            width: 96px;
            height: 96px;
            margin: 0 auto 1rem;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 18px hsl(var(--hue) 100% 55% / 0.5);
            border: 2px solid hsl(var(--hue) 100% 70% / 0.8);
            background: #2c2e3a;
            line-height: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .avatar-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #3b3f5c;
            color: #fff;
            font-size: 3rem;
            font-weight: 500;
            line-height: 1;
        }

        .profile h1 {
            font-size: 1.7rem;
            font-weight: 700;
            color: #f1f3f9;
            letter-spacing: -0.3px;
            margin-bottom: 0.3rem;
        }

        .profile .bio {
            color: #b0b6dd;
            font-size: 0.9rem;
            max-width: 280px;
            margin: 0 auto;
            line-height: 1.4;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin: 0.5rem 0 0;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            padding: 1rem 1.5rem;
            text-decoration: none;
            color: #eef2ff;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.1);
            gap: 12px;
            transition: background 0.25s ease, border-color 0.25s ease,
                        box-shadow 0.25s ease, transform 0.25s ease;
        }

        .link-btn:focus-visible {
            outline: 2px solid hsl(var(--hue) 100% 70%);
            outline-offset: 3px;
        }

        .link-btn:hover,
        .link-btn:focus-visible {
            background: hsl(var(--hue) 70% 45% / 0.35);
            border-color: hsl(var(--hue) 100% 65% / 0.8);
            box-shadow: 0 0 16px hsl(var(--hue) 100% 55% / 0.45);
            color: #fff;
        }

        .link-btn:hover { transform: translateY(-2px); }

        .link-left {
            display: flex;
            align-items: center;
            gap: 14px;
            overflow: hidden;
        }

        .link-left i {
            font-size: 1.3rem;
            width: 28px;
            text-align: center;
            color: hsl(var(--hue) 100% 78%);
        }

        .link-text {
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-links-message {
            color: #8e94b0;
            text-align: center;
            padding: 1rem;
            font-style: italic;
        }

        @media (max-width: 380px) {
            .micro-card { padding: 1.5rem 1.25rem; border-radius: 2rem; }
            .link-btn { padding: 0.9rem 1.2rem; }
        }

        /* Hormati pengguna yang mematikan animasi */
        @media (prefers-reduced-motion: reduce) {
            .micro-card, .micro-card::before { animation: none; }
            .link-btn { transition: none; }
            .link-btn:hover { transform: none; }
        }
    </style>
</head>
<body>
<main class="micro-card">
    <header class="profile">
        <div class="avatar" id="avatarContainer"></div>
        <h1 id="profileName"></h1>
        <p class="bio" id="profileBio"></p>
    </header>
    <nav class="links-list" id="linksList" aria-label="Daftar tautan"></nav>
</main>

<script>
    // ============================================================
    // KONFIGURASI - ubah sesuai keinginan
    // ============================================================
    const profile = {
        name: "MAN 2 Grobogan",
        bio: "Cerdas, Santun, dan Berprestasi",
        avatarUrl: "assets/logo.webp",
        // Link gambar latar (otomatis digelapkan 80%). Kosongkan untuk latar polos gelap.
        backgroundUrl: "assets/hero.webp"
    };

    // Hanya tautan yang memang untuk publik. Semua isi array ini terlihat lewat View Source.
    // Ikon memakai kelas Font Awesome, mis. "fas fa-globe", "fab fa-instagram".
    const links = [
        { text: "MASTER", url: "https://nas.adwi.my.id/s/54z8zwrbJ4XzsN2", icon: "fas fa-folder-open" },
        { text: "Matematika Lanjut Kelas 11", url: "https://nas.adwi.my.id/s/JWQ56HEogHYrkZP", icon: "fas fa-globe" },
        { text: "Uji Web MAN", url: "https://webmandaga.github.io/beranda/", icon: "fas fa-globe" }
    ];
    // ============================================================

    function renderBackground() {
        const url = (profile.backgroundUrl || "").trim();
        if (!url) return;
        const safe = url.replace(/["\\()]/g, encodeURIComponent);
        document.body.style.setProperty("--bg-image", `url("${safe}")`);
    }

    function renderAvatar() {
        const box = document.getElementById("avatarContainer");
        const initial = (profile.name || "U").charAt(0).toUpperCase();

        function showFallback() {
            box.textContent = "";
            const d = document.createElement("div");
            d.className = "avatar-fallback";
            d.setAttribute("aria-hidden", "true");
            d.textContent = initial;
            box.appendChild(d);
        }

        if (!profile.avatarUrl || !profile.avatarUrl.trim()) {
            showFallback();
            return;
        }
        const img = new Image();
        img.alt = "Foto " + (profile.name || "profil");
        img.width = 96;
        img.height = 96;
        img.decoding = "async";
        img.referrerPolicy = "no-referrer";
        img.onerror = showFallback;
        img.src = profile.avatarUrl.trim();
        box.appendChild(img);
    }

    function renderProfile() {
        document.getElementById("profileName").textContent = profile.name || "Pengguna";
        document.getElementById("profileBio").textContent = profile.bio || "";
        renderAvatar();
    }

    function renderLinks() {
        const container = document.getElementById("linksList");
        const valid = links.filter(l => l && l.text && l.url && l.url !== "#");
        container.textContent = "";

        if (valid.length === 0) {
            const p = document.createElement("p");
            p.className = "empty-links-message";
            p.textContent = "Belum ada tautan yang ditampilkan.";
            container.appendChild(p);
            return;
        }

        valid.forEach(link => {
            const a = document.createElement("a");
            a.className = "link-btn";
            a.href = link.url;
            a.target = "_blank";
            a.rel = "noopener noreferrer";

            const left = document.createElement("span");
            left.className = "link-left";

            const icon = document.createElement("i");
            icon.className = link.icon || "fas fa-link";
            icon.setAttribute("aria-hidden", "true");

            const label = document.createElement("span");
            label.className = "link-text";
            label.textContent = link.text;

            left.append(icon, label);

            const arrow = document.createElement("i");
            arrow.className = "fas fa-arrow-right";
            arrow.setAttribute("aria-hidden", "true");

            a.append(left, arrow);
            container.appendChild(a);
        });
    }

    renderBackground();
    renderProfile();
    renderLinks();
</script>
</body>
</html>
